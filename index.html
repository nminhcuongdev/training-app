<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PPL Coach">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ECEEEA">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F1216">
<meta name="format-detection" content="telephone=no">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>PPL Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
/* Layout: app một cột cho điện thoại trong phòng tập — thanh trên (đồng hồ buổi tập), nội dung theo tab, thanh nghỉ + thanh tab cố định dưới đáy */
:root{
  --bg:#ECEEEA; --surface:#F8F9F6; --surface-2:#E2E5DF; --ink:#15181D; --muted:#59606A; --line:#D2D6CE;
  --accent:#2B56E3; --accent-ink:#FFFFFF; --accent-soft:#DCE4FB;
  --push:#D9541E; --pull:#2470C9; --leg:#23875A; --rest:#8A9099;
  --err:#CF3238; --ok:#1F8A5B; --ok-soft:#D7EEE2; --warn:#A86C12;
  --stage:#12161D; --stage-ink:#E8ECF1; --stage-muted:#9BA6B4;
  --timer-bg:#15181D; --timer-ink:#F4F6F8;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1216; --surface:#171B21; --surface-2:#20252D; --ink:#E7EAEE; --muted:#9AA3AE; --line:#2A3039;
  --accent:#86A0FF; --accent-ink:#0F1216; --accent-soft:#232C47;
  --push:#FF8650; --pull:#64A8FF; --leg:#4FC48E; --rest:#7D8590;
  --err:#FF6B6F; --ok:#4FC48E; --ok-soft:#173226; --warn:#E6B04F;
  --timer-bg:#E9ECF1; --timer-ink:#12161D; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1216; --surface:#171B21; --surface-2:#20252D; --ink:#E7EAEE; --muted:#9AA3AE; --line:#2A3039;
  --accent:#86A0FF; --accent-ink:#0F1216; --accent-soft:#232C47;
  --push:#FF8650; --pull:#64A8FF; --leg:#4FC48E; --rest:#7D8590;
  --err:#FF6B6F; --ok:#4FC48E; --ok-soft:#173226; --warn:#E6B04F;
  --timer-bg:#E9ECF1; --timer-ink:#12161D; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a{touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.app{max-width:760px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:0 calc(170px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.45rem;text-transform:uppercase;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand i{display:inline-flex;gap:3px}.brand i b{width:6px;height:18px;border-radius:2px;display:block}
.clock{font-family:var(--f-mono);font-size:.85rem;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:flex;gap:8px;align-items:center}
.clock .dot{width:8px;height:8px;border-radius:50%;background:var(--rest)}
.clock.on .dot{background:var(--err);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}

/* day chips */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:14px}
.dchip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 2px 5px;display:grid;gap:1px;text-align:center;position:relative;min-width:0}
.dchip small{font-family:var(--f-mono);font-size:.62rem;color:var(--muted)}
.dchip b{font-family:var(--f-display);font-size:.86rem;font-weight:700;text-transform:uppercase;line-height:1;letter-spacing:0;overflow:hidden;white-space:nowrap}
@media (min-width:480px){.dchip b{font-size:1rem}}
.dchip.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dchip.today::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.dchip .bar{height:3px;border-radius:2px;margin:3px 6px 0}

/* session card */
.sess{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;margin-bottom:14px}
.sess .row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sess h1{font-size:3rem;font-weight:800;line-height:.9;text-transform:uppercase}
.sess .fo{color:var(--muted);font-size:.9rem}
.sess .meta{display:flex;gap:16px;font-size:.8rem;color:var(--muted)}
.sess .meta b{display:block;font-family:var(--f-mono);font-size:1.05rem;color:var(--ink)}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);font-size:.95rem}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--err);border:1px solid var(--err)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.banner{border:1px solid var(--warn);color:var(--ink);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:.88rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.restday{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:22px 16px;display:grid;gap:8px}
.restday h1{font-size:2.6rem;font-weight:800;text-transform:uppercase;color:var(--muted)}

/* exercise cards */
.exlist{display:grid;gap:10px}
.exc{scroll-margin-top:calc(64px + env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.exc.done{border-color:var(--ok)}
.exh{width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;background:none;border:0;text-align:left}
.exh .n{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.exh .t{font-weight:700;font-size:1rem;line-height:1.25}
.exh .m{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);margin-top:2px}
.prog{display:flex;gap:3px}
.prog i{width:8px;height:8px;border-radius:2px;background:var(--surface-2);border:1px solid var(--line)}
.prog i.d{background:var(--ok);border-color:var(--ok)}
.exb{padding:0 14px 14px;display:grid;gap:12px}
.demo{background:var(--stage);border-radius:10px;overflow:hidden;color:var(--stage-ink)}
.host{position:relative;aspect-ratio:16/11;max-width:100%;width:100%;touch-action:pan-y;cursor:grab}
.host canvas{display:block;width:100%;height:100%}
.host .ovm{position:absolute;right:8px;top:8px;font-family:var(--f-mono);font-size:.66rem;font-weight:700;letter-spacing:.06em;padding:3px 7px;border-radius:4px;background:#1f8a5b;color:#fff;pointer-events:none}
.host .ovm.bad{background:#d23a40}
.host .ovl{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:2px;font-size:.66rem;color:var(--stage-muted);pointer-events:none}
.host .ovl span{display:flex;gap:5px;align-items:center}.host .ovl i{width:8px;height:8px;border-radius:50%;display:inline-block}
.host .nogl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--stage-muted);font-size:.85rem}
.dsub{padding:8px 12px;font-size:.86rem;line-height:1.4;min-height:3.2em;border-top:1px solid #232a34}
.dsub b{color:#ffd08a;font-weight:600}.dsub b.e{color:#ff8d90}
.dctl{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 10px;align-items:center}
.dbtn{background:#222934;border:1px solid #303846;color:var(--stage-ink);border-radius:999px;padding:5px 11px;font-size:.78rem}
.dbtn.on{background:#e8ecf1;color:#12161d;border-color:#e8ecf1}
.dbtn.bad.on{background:#d23a40;border-color:#d23a40;color:#fff}
.dbtn.ok.on{background:#1f8a5b;border-color:#1f8a5b;color:#fff}
.dctl .sp{flex:1}
details.guide{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
details.guide summary{padding:10px 12px;cursor:pointer;font-weight:600;font-size:.9rem;list-style:none;display:flex;justify-content:space-between}
details.guide summary::after{content:"+";font-family:var(--f-mono);color:var(--muted)}
details.guide[open] summary::after{content:"–"}
.gbody{padding:0 12px 12px;font-size:.88rem;display:grid;gap:10px}
.gbody p{margin:0}
.gbody ol,.gbody ul{margin:0;padding-left:18px;display:grid;gap:4px}
.gerr{border-left:3px solid var(--err);padding-left:10px}
.gerr b{display:block}
.k{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.sug{border-radius:10px;padding:10px 12px;background:var(--accent-soft);font-size:.88rem;display:grid;gap:4px}
.sug b.big{font-family:var(--f-mono);font-size:1.15rem}
.sug .up{color:var(--ok);font-weight:700}
.warm{font-size:.8rem;color:var(--muted)}
.warm b{font-family:var(--f-mono);color:var(--ink);font-weight:600}
.sets{display:grid;gap:6px}
.sh{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 52px;gap:8px;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 2px}
.sr{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 52px;gap:8px;align-items:center}
.sr .no{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);text-align:center}
.step{display:grid;grid-template-columns:34px minmax(0,1fr) 34px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg);height:44px}
.step button{border:0;background:var(--surface-2);font-size:1.1rem;font-family:var(--f-mono)}
.step input{border:0;background:transparent;text-align:center;font-family:var(--f-mono);font-size:16px;width:100%;min-width:0;padding:0;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.chk{height:44px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:1.2rem;color:var(--muted)}
.sr.d .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.sr.d .step{background:var(--ok-soft);border-color:transparent}
.sr.d .step button{opacity:.35}
.exf{display:flex;gap:8px;flex-wrap:wrap}
.exf .btn{flex:1;padding:10px 12px;font-size:.88rem}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0;font-size:.85rem}

/* rest bar */
.restbar{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:25;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.restin{max-width:760px;margin:0 auto 8px;background:var(--timer-bg);color:var(--timer-ink);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.restin .lab{font-size:.75rem;opacity:.75}
.restin .tm{font-family:var(--f-mono);font-size:2rem;font-weight:700;line-height:1}
.restin .bts{display:flex;gap:6px;grid-row:1/3;grid-column:2}
.restin .bts button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:8px;padding:8px 10px;font-family:var(--f-mono);font-size:.8rem}
.restin .pb{grid-column:1/-1;height:4px;border-radius:2px;background:rgba(127,127,127,.3);overflow:hidden}
.restin .pb i{display:block;height:100%;background:var(--accent);width:0}
.restin.go{background:var(--ok);color:#fff}
.restin.go .pb i{background:#fff}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:26;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar div{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar a{display:grid;justify-items:center;gap:2px;padding:8px 0 9px;color:var(--muted);text-decoration:none;font-size:.72rem;font-weight:600}
.tabbar a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar a.on{color:var(--accent)}

/* plan / progress / data */
.vh{margin:4px 0 14px}
.vh h2{font-size:2rem;font-weight:800;text-transform:uppercase;line-height:1}
.vh p{margin:6px 0 0;color:var(--muted);font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;min-width:0}
.card h3{font-size:1.2rem;margin-bottom:6px}
.card p{margin:0 0 8px;font-size:.9rem}
.week{display:grid;gap:10px}
.wd{display:grid;grid-template-columns:70px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.wd .ty{font-family:var(--f-display);font-size:1.5rem;font-weight:800;text-transform:uppercase;line-height:1}
.wd .dn{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.wd ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.wd li button{background:none;border:0;padding:3px 0;text-align:left;width:100%;display:flex;justify-content:space-between;gap:8px;font-size:.86rem}
.wd li button span:last-child{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
.wd.rest{border-style:dashed;background:transparent}
.wd .bar{width:4px;border-radius:2px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ovx{overflow-x:auto}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.stats b{display:block;font-family:var(--f-mono);font-size:1.3rem}
.stats small{font-size:.72rem;color:var(--muted)}
.pex{border-top:1px solid var(--line)}
.pex summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px 0}
.pex summary b{font-size:.92rem}
.pex summary small{display:block;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.trend{font-family:var(--f-mono);font-size:.8rem;text-align:right}
.trend.up{color:var(--ok)}.trend.dn{color:var(--err)}
.hist{display:grid;gap:4px;padding:0 0 10px;font-size:.82rem}
.hist div{display:flex;justify-content:space-between;gap:8px}
.hist span:last-child{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);text-align:right}
.sesl{display:grid;gap:8px}
.sesi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.sesi b{font-size:.95rem}
.sesi small{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.sesi .x{background:none;border:0;color:var(--muted);font-size:.8rem}
.empty{border:1px dashed var(--line);border-radius:12px;padding:22px 16px;text-align:center;color:var(--muted);font-size:.9rem}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px;font-family:var(--f-mono);font-size:16px}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:.86rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));z-index:40;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:.85rem;max-width:90vw}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px}
.modal .card{max-width:420px;width:100%;margin:0}
.modal .stats{margin:10px 0}
.field{display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
.field input,.field select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:16px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.tog{display:flex;align-items:center;gap:8px;font-size:.9rem;margin-bottom:8px}
@media (min-width:700px){ .host{aspect-ratio:16/10} .sess h1{font-size:3.6rem} }
@media (prefers-reduced-motion: reduce){ .clock.on .dot{animation:none} }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><i aria-hidden="true"><b style="background:var(--push)"></b><b style="background:var(--pull)"></b><b style="background:var(--leg)"></b></i>PPL Coach</div>
    <div class="clock" id="clock" title="Thời gian buổi tập"><span class="dot"></span><span id="clockT">Chưa bắt đầu</span></div>
  </div>
  <main>
    <section id="v-today"></section>
    <section id="v-plan" hidden></section>
    <section id="v-progress" hidden></section>
    <section id="v-data" hidden></section>
  </main>
</div>

<div class="restbar" id="restbar" hidden>
  <div class="restin" id="restin">
    <div><div class="lab" id="restLab">Nghỉ giữa hiệp</div><div class="tm" id="restT">0:00</div></div>
    <div class="bts"><button id="rMinus" aria-label="Bớt 15 giây">−15</button><button id="rPlus" aria-label="Thêm 15 giây">+15</button><button id="rSkip">Bỏ qua</button></div>
    <div class="pb"><i id="restP"></i></div>
  </div>
</div>

<nav class="tabbar" aria-label="Điều hướng"><div>
  <a href="#today" data-v="today"><svg viewBox="0 0 24 24"><path d="M6 9v6M18 9v6M3 11v2M21 11v2M6 12h12"/></svg>Hôm nay</a>

const st={err:-1,t:0,playing:!reduce,speed:1,rep:1,lastPhase:-1,visible:false};

function ease(u){ u=Math.min(1,Math.max(0,u)); return 0.5-0.5*Math.cos(Math.PI*u); }
function prepPose(){
  const ex=cur.ex, er=st.err>=0?ex.errors[st.err]:null;
  const A=merge(DEF,ex.A); const B=merge(A,ex.B);
  cur.A=er&&er.A?merge(A,er.A):A; cur.B=er&&er.B?merge(B,er.B):B;
  cur.M=null;
  if(ex.M){
    const m=mixPose(cur.A,cur.B,0.5);
    cur.M=merge(m,ex.M);
    if(er&&er.B) for(const k in er.B) cur.M[k]=m[k];   // lỗi ghi đè điểm cuối → điểm giữa nội suy lại cho khớp
    if(er&&er.M) cur.M=merge(cur.M,er.M);
  }
  cur.tempo=(er&&er.tempo)||ex.tempo;
}
function poseAt(p){ if(cur.M){ return p<0.5? mixPose(cur.A,cur.M,ease(p*2)) : mixPose(cur.M,cur.B,ease((p-0.5)*2)); } return mixPose(cur.A,cur.B,ease(p)); }
function phaseInfo(t){
  const tp=cur.tempo, tot=tp[0]+tp[1]+tp[2]+tp[3]; let x=((t%tot)+tot)%tot;
  if(x<tp[0]) return {ph:0,p:x/tp[0],tot}; x-=tp[0];
  if(x<tp[1]) return {ph:1,p:1,tot}; x-=tp[1];
  if(x<tp[2]) return {ph:2,p:1-x/tp[2],tot}; return {ph:3,p:0,tot};
}
function phaseName(ph,ex){
  ex=ex||cur.ex; const eccFirst=ex.startEcc;
  if(ph===0) return eccFirst?"Hạ, cơ giãn ra":"Lên, cơ co lại";
  if(ph===2) return eccFirst?"Lên, cơ co lại":"Hạ, cơ giãn ra";
  const contracted=(ex.contractAt==="B")===(ph===1);
  return contracted?"Giữ ở điểm co":"Giữ ở điểm giãn";
}
function highlight(c){
  const ex=cur.ex; const pulse=0.35+0.65*c;
  Object.keys(MAT).forEach(k=>{ const m=MAT[k];
    if(ex.p.includes(k)){ m.color.copy(C_P); m.emissive.copy(C_P).multiplyScalar(0.15+0.45*pulse); }
    else if(ex.s.includes(k)){ m.color.copy(C_S); m.emissive.copy(C_S).multiplyScalar(0.08+0.18*pulse); }
    else { m.color.copy(MUSC_BASE); m.emissive.setRGB(0,0,0); } });
}

function load(id){

}

}

let last=performance.now();

    if(st.playing){ const tot=phaseInfo(st.t).tot; const pc=Math.floor(st.t/tot); st.t+=dt*st.speed; if(Math.floor(st.t/tot)>pc) st.rep++; }
    const info=phaseInfo(st.t);
    let pose=poseAt(info.p);
    if(blendFrom && blendT<1){ blendT=Math.min(1,blendT+dt/0.5); pose=mixPose(blendFrom,pose,ease(blendT)); if(blendT>=1) blendFrom=null; }

}

  const id=row.id, inc=KIND[id][1], kind=KIND[id][0];
  const L=lastFor(id);
  if(!L) return {w:kind==="bw"?0:null, r:row.lo, first:true,
    msg:kind==="bw"?`Chưa có dữ liệu. Bắt đầu không đeo tạ; nếu làm dễ hơn ${row.hi} rep thì đeo thêm 2.5–5 kg.`
      :`Chưa có dữ liệu. Chọn mức tạ bạn làm tối đa được khoảng ${row.hi+row.rir} rep, để mỗi hiệp còn ${row.rir} rep dự trữ.`};
  const sets=L.sets; const w=Math.max(...sets.map(x=>x.w)); const top=sets.filter(x=>x.w===w);
  const when=fmtDate(L.s.start);
  if(top.length>=row.sets && top.every(x=>x.r>=row.hi)) return {w:Math.round((w+inc)*100)/100,r:row.lo,up:true,last:sets,when,msg:`Lần trước (${when}) mọi hiệp đều đạt ${row.hi} rep. Tăng ${nf.format(inc)} kg, làm lại từ ${row.lo} rep.`};
  if(top.some(x=>x.r<row.lo)) return {w,r:row.lo,last:sets,when,msg:`Lần trước (${when}) có hiệp dưới ${row.lo} rep. Giữ mức tạ, cố đạt ít nhất ${row.lo} rep mọi hiệp.`};
  const minR=Math.min(...top.map(x=>x.r));
  return {w,r:Math.min(row.hi,minR+1),last:sets,when,msg:`Lần trước (${when}): giữ mức tạ, thêm 1 rep ở hiệp yếu nhất.`};
}
function warmup(row,w){
  const kind=KIND[row.id][0];
  if((kind!=="bb"&&kind!=="smith")||!w||w<(kind==="bb"?30:10)) return "";
  const parts=[kind==="bb"?`<b>20 kg</b> × 10`:`<b>Thanh không</b> × 10`]; let prev=kind==="bb"?20:0;
  [[0.5,8],[0.7,5],[0.85,2]].forEach(([p,r])=>{ const x=roundTo(w*p,2.5); if(x>prev&&x<w){ parts.push(`<b>${fw(x)} kg</b> × ${r}`); prev=x; } });
  return "Khởi động: "+parts.join(" → ");
}

/* ---------- sets state ---------- */
const draft={};
const ui={view:"today",day:S.cur?S.cur.day:todayIdx(),open:null,confirm:null};
function initSets(row){ const g=suggest(row); return Array.from({length:row.sets},()=>({w:g.w==null?"":g.w,r:g.r,done:false})); }
function setsFor(day,row){
  if(S.cur&&S.cur.day===day){ if(!S.cur.ex[row.id]){ const k=day+":"+row.id; S.cur.ex[row.id]={sets:draft[k]||initSets(row)}; delete draft[k]; } return S.cur.ex[row.id].sets; }
  const k=day+":"+row.id; return draft[k]||(draft[k]=initSets(row));
}
const doneCount=(day,row)=>setsFor(day,row).filter(x=>x.done).length;

/* ---------- audio, wake lock, toast ---------- */
let ac=null;

function beep(n){ if(!S.prefs.sound||!ac) return; try{ for(let i=0;i<n;i++){ const o=ac.createOscillator(),g=ac.createGain(); o.frequency.value=i===n-1?1175:880; o.connect(g); g.connect(ac.destination); const t=ac.currentTime+i*0.28; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.35,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.2); o.start(t); o.stop(t+0.22); } }catch(e){} }
let wl=null;

/* ---------- session ---------- */
function startSession(day){
  if(S.cur) return;
  S.cur={day,start:Date.now(),ex:{},rest:null};
  PROG[day].ex.forEach(row=>{ const k=day+":"+row.id; if(draft[k]){ S.cur.ex[row.id]={sets:draft[k]}; delete draft[k]; } });
  save(); unlockAudio(); lockScreen(); toast(`Bắt đầu buổi ${PROG[day].ty}`); renderToday(); tickClock();
}
function summary(){
  const c=S.cur; let sets=0,vol=0; const prs=[];
  Object.keys(c.ex).forEach(id=>{ const done=c.ex[id].sets.filter(x=>x.done&&x.w!==""&&x.r>0); sets+=done.length; done.forEach(x=>vol+=(+x.w)*x.r);
    if(done.length){ const best=Math.max(...done.map(x=>e1(id,+x.w,x.r))); const prev=history(id).flatMap(h=>h.sets.map(x=>e1(id,x.w,x.r))); if(prev.length&&best>Math.max(...prev)+0.01) prs.push(EX[id].name); } });
  return {sets,vol,dur:Date.now()-c.start,prs};
}

    ${sm.prs.length?`<p>Kỷ lục mới (1RM ước tính): <b>${sm.prs.map(esc).join(", ")}</b></p>`:""}

    S.sessions.push(rec); S.cur=null; save(); close(); releaseLock(); stopRest(); toast(`Đã lưu buổi ${rec.ty}`); for(const k in draft) delete draft[k]; renderToday(); tickClock();

/* ---------- rest timer ---------- */
let fired=false;
function startRest(sec,label){ if(!S.cur) return; S.cur.rest={end:Date.now()+sec*1000,dur:sec,label}; fired=false; save(); tickRest(); }
function stopRest(){ if(S.cur){ S.cur.rest=null; save(); } $("#restbar").hidden=true; }
function tickRest(){
  const r=S.cur&&S.cur.rest; const bar=$("#restbar");
  if(!r){ bar.hidden=true; return; }
  const rem=(r.end-Date.now())/1000; bar.hidden=false;
  const box=$("#restin");
  if(rem>0){ box.classList.remove("go"); $("#restT").textContent=fmtRest(rem); $("#restLab").textContent=r.label; $("#restP").style.width=(100*(1-rem/r.dur)).toFixed(1)+"%"; }
  else { if(!fired){ fired=true; beep(3); try{ navigator.vibrate&&navigator.vibrate([200,100,200]); }catch(e){} }
    box.classList.add("go"); $("#restT").textContent="Vào hiệp!"; $("#restLab").textContent=r.label; $("#restP").style.width="100%";
    if(rem<-20) stopRest(); }
}
$("#rMinus").onclick=()=>{ if(S.cur&&S.cur.rest){ S.cur.rest.end-=15000; save(); tickRest(); } };
$("#rPlus").onclick=()=>{ if(S.cur&&S.cur.rest){ const r=S.cur.rest; if(r.end<Date.now()) { r.end=Date.now(); fired=false; } r.end+=15000; r.dur=Math.max(r.dur,(r.end-Date.now())/1000); save(); tickRest(); } };

function tickClock(){ const c=$("#clock"); if(S.cur){ c.classList.add("on"); $("#clockT").textContent=`${PROG[S.cur.day].ty} · ${fmtClock(Date.now()-S.cur.start)}`; } else { c.classList.remove("on"); $("#clockT").textContent="Chưa bắt đầu"; } }

function setsHTML(day,row){

function bodyHTML(day,row){

      <div class="ovl"><span><i style="background:#FF6A2B"></i>Cơ chính</span><span><i style="background:#F2B840"></i>Cơ phụ</span></div><div class="ovm" data-ovm>CHUẨN</div></div>

    ${guideHTML(ex)}
    <div class="sug">${g.first?"":`<div>Gợi ý hôm nay: <b class="big">${fw(g.w)} kg × ${g.r}</b> ${g.up?'<span class="up">↑ tăng tạ</span>':""}</div>`}<div>${esc(g.msg)}</div>${g.last?`<div class="warm">Lần trước: <b>${setsTxt(g.last)}</b></div>`:""}</div>
    ${warmup(row,+wNow||+g.w)?`<div class="warm">${warmup(row,+wNow||+g.w)}</div>`:""}

}
function renderToday(){
  const v=$("#v-today"), day=ui.day, D=PROG[day], ti=todayIdx();
  let h=`<div class="days" role="tablist">${PROG.map((d,i)=>`<button class="dchip ${i===day?"sel":""} ${i===ti?"today":""}" data-day="${i}" role="tab" aria-selected="${i===day}"><small>${d.s}</small><b>${d.ty}</b><span class="bar" style="background:${DAYCOL[d.c]}"></span></button>`).join("")}</div>`;
  if(S.cur&&S.cur.day!==day) h+=`<div class="banner"><span>Buổi <b>${PROG[S.cur.day].ty}</b> đang diễn ra.</span><button class="btn ghost" data-go="${S.cur.day}" style="padding:6px 12px">Quay lại buổi đó</button></div>`;
  if(!storeOK) h+=`<div class="banner"><span>Trình duyệt đang chặn bộ nhớ, nên dữ liệu sẽ mất khi đóng trang. Hãy mở trang ở cửa sổ thường (không ẩn danh).</span></div>`;
  if(!D.ex){ h+=`<div class="restday"><div class="eyebrow">${D.d}</div><h1>Ngày nghỉ</h1><p>${esc(D.rest)}</p><p class="warm">Cơ lớn lên trong lúc nghỉ, không phải lúc tập. Muốn tập bù thì chọn buổi khác ở hàng trên.</p></div>`; v.innerHTML=h; return; }
  const running=S.cur&&S.cur.day===day;
  const totalSets=D.ex.reduce((a,r)=>a+setsFor(day,r).length,0), doneSets=D.ex.reduce((a,r)=>a+doneCount(day,r),0);
  h+=`<div class="sess"><div class="row"><div><div class="eyebrow">${D.d}${day===ti?" · hôm nay":""}</div><h1 style="color:${DAYCOL[D.c]}">${D.ty}</h1><div class="fo">${esc(D.fo)}</div></div>
    <div class="meta"><span><b>${D.ex.length}</b>bài</span><span><b>${doneSets}/${totalSets}</b>hiệp</span><span><b>~${D.min}'</b>phút</span></div></div>
    ${running?`<button class="btn block" data-a="finish" style="background:var(--ink);color:var(--bg)">Kết thúc buổi tập</button>`:S.cur?"":`<button class="btn block" data-a="start">Bắt đầu buổi tập</button>`}</div>`;
  if(ui.open===null||(ui.open!==""&&!D.ex.some(r=>r.id===ui.open))){ const nx=D.ex.find(r=>doneCount(day,r)<setsFor(day,r).length)||D.ex[0]; ui.open=nx.id; }
  h+=`<div class="exlist">${D.ex.map((row,i)=>{ const sets=setsFor(day,row), all=sets.every(x=>x.done);

function mountDemo(){
  const card=document.querySelector(`.exc[data-id="${ui.open}"]`); if(!card||!demo) return;
  const hostEl=card.querySelector("[data-host]"); demo.attach(hostEl);

  if(e>=0){ const s=card.querySelector("[data-sub]"); if(s) s.innerHTML=`<b class="e">✕ ${esc(ex.errors[e].t)}.</b> ${esc(ex.errors[e].why)}`; }
}
function onPhase(ph){

function phaseName(ph,ex){ const eccFirst=ex.startEcc; if(ph===0) return eccFirst?"Hạ, cơ giãn ra":"Lên, cơ co lại"; if(ph===2) return eccFirst?"Lên, cơ co lại":"Hạ, cơ giãn ra"; return ((ex.contractAt==="B")===(ph===1))?"Giữ ở điểm co":"Giữ ở điểm giãn"; }

function refreshCard(row){
  const day=ui.day, card=document.querySelector(`.exc[data-id="${row.id}"]`); if(!card) return;

  const box=card.querySelector("[data-sets]"); if(box) box.innerHTML=setsHTML(day,row);
  const m=document.querySelector(".sess .meta"); if(m){ const D=PROG[day]; const t=D.ex.reduce((a,r)=>a+setsFor(day,r).length,0), d=D.ex.reduce((a,r)=>a+doneCount(day,r),0); m.children[1].innerHTML=`<b>${d}/${t}</b>hiệp`; }

function openEx(id,scroll){ ui.open=id; renderToday(); if(scroll){ const c=document.querySelector(`.exc[data-id="${id}"]`); if(c) c.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"}); } }

$("#v-today").addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.day!==undefined){ ui.day=+t.dataset.day; ui.open=null; renderToday(); return; }
  if(t.dataset.go!==undefined){ ui.day=+t.dataset.go; ui.open=null; renderToday(); return; }
  if(t.dataset.de!==undefined){ demo&&demo.setErr(+t.dataset.de); if(demo&&!demo.playing){ demo.toggle(); } syncDemoUI(); return; }
  if(t.dataset.dplay!==undefined){ demo&&demo.toggle(); syncDemoUI(); return; }
  if(t.dataset.cam){ demo&&demo.preset(t.dataset.cam); t.parentElement.querySelectorAll("[data-cam]").forEach(b=>b.classList.toggle("on",b===t)); return; }
  const a=t.dataset.a; if(!a) return;
  const day=ui.day, D=PROG[day];
  if(a==="start"){ startSession(day); return; }
  if(a==="finish"){ finishModal(); return; }
  const card=t.closest(".exc"); if(!card) return; const row=D.ex.find(r=>r.id===card.dataset.id); const sets=setsFor(day,row); const i=+t.dataset.i;
  if(a==="toggle"){ ui.open=(ui.open===row.id)?"":row.id; renderToday(); return; }
  const st=stepOf(row.id);
  if(a==="wm"||a==="wp"){ const x=sets[i]; const cv=x.w===""?0:+x.w; x.w=Math.max(0,Math.round((cv+(a==="wp"?st:-st))*100)/100);
    if(!x.done) for(let j=i+1;j<sets.length;j++) if(!sets[j].done) sets[j].w=x.w; refreshCard(row); return; }
  if(a==="rm"||a==="rp"){ sets[i].r=Math.max(0,(+sets[i].r||0)+(a==="rp"?1:-1)); refreshCard(row); return; }
  if(a==="chk"){
    if(S.cur&&S.cur.day!==day){ toast(`Kết thúc buổi ${PROG[S.cur.day].ty} trước đã`); return; }
    const x=sets[i];
    if(!x.done&&(x.w===""||!(+x.r>0))){ toast("Nhập mức tạ và số rep trước"); return; }
    if(!S.cur) startSession(day);
    const live=setsFor(day,row); const y=live[i]; y.done=!y.done; y.at=Date.now();
    if(y.done){
      const left=live.filter(z=>!z.done).length; const idx=D.ex.indexOf(row);
      const nextRow=D.ex.slice(idx+1).find(r=>doneCount(day,r)<setsFor(day,r).length);
      if(left>0) startRest(row.rest,`Nghỉ · còn ${left} hiệp ${EX[row.id].name}`);
      else if(nextRow){ startRest(Math.max(90,row.rest),`Xong bài! Tiếp theo: ${EX[nextRow.id].name}`); }
      else { stopRest(); toast("Xong bài cuối. Bấm Kết thúc buổi tập để lưu."); }
      unlockAudio();
      if(left===0&&nextRow){ openEx(nextRow.id,true); save(); return; }
    }
    refreshCard(row); save(); return;
  }
  if(a==="add"){ const l=sets[sets.length-1]; sets.push({w:l?l.w:"",r:l?l.r:row.lo,done:false}); renderToday(); return; }
  if(a==="del"){ if(sets.length>1&&!sets[sets.length-1].done) sets.pop(); renderToday(); return; }
  if(a==="next"){ const idx=D.ex.indexOf(row); const n=D.ex[(idx+1)%D.ex.length]; openEx(n.id,true); return; }
});
$("#v-today").addEventListener("change",e=>{
  const inp=e.target.closest("input[data-f]"); if(!inp) return; const card=inp.closest(".exc"); const row=PROG[ui.day].ex.find(r=>r.id===card.dataset.id);
  const sets=setsFor(ui.day,row), i=+inp.dataset.i;
  if(inp.dataset.f==="w"){ const v=parseFloat(inp.value.replace(",",".")); sets[i].w=isNaN(v)?"":Math.max(0,v); if(!sets[i].done) for(let j=i+1;j<sets.length;j++) if(!sets[j].done) sets[j].w=sets[i].w; }
  else { const v=parseInt(inp.value,10); sets[i].r=isNaN(v)?0:Math.max(0,v); }
  refreshCard(row);
});

/* ---------- PLAN ---------- */
function renderPlan(){
  $("#v-plan").innerHTML=`<div class="vh"><div class="eyebrow">Lịch tuần</div><h2>Push · Pull · Leg · Upper · Lower</h2><p>Mỗi nhóm cơ được tập 2 lần/tuần. Bấm vào một bài để mở bài đó trong buổi tương ứng.</p></div>
  <div class="week">${PROG.map((d,di)=>d.ex?`<div class="wd"><div><div class="ty" style="color:${DAYCOL[d.c]}">${d.ty}</div><div class="dn">${d.d}</div><div class="dn">~${d.min} phút</div></div>
    <ul>${d.ex.map(r=>`<li><button data-pd="${di}" data-pid="${r.id}"><span>${esc(EX[r.id].name)}</span><span>${r.sets}×${repTxt(r)}</span></button></li>`).join("")}</ul></div>`
    :`<div class="wd rest"><div><div class="ty" style="color:var(--muted)">Nghỉ</div><div class="dn">${d.d}</div></div><p style="margin:0;font-size:.86rem;color:var(--muted)">${esc(d.rest)}</p></div>`).join("")}</div>
  <div class="card" style="margin-top:12px"><h3>Cách app gợi ý mức tạ</h3>
    <p>App dùng cách <b>tăng tải kép</b>: giữ mức tạ cho đến khi mọi hiệp đạt số rep cao nhất của khoảng (ví dụ 8 trong 6–8). Lần sau app gợi ý tăng tạ (thanh đòn +2.5 kg, tạ đơn +1–2 kg, máy +5 kg) và quay về số rep thấp nhất.</p>
    <p><b>RIR</b> là số rep còn làm được nữa khi dừng hiệp. RIR 2 nghĩa là dừng khi còn sức làm thêm 2 rep.</p>
    <p>Cứ 6 tuần, tuần thứ 7 tập nhẹ (<b>deload</b>): giảm một nửa số hiệp, giữ mức tạ.</p></div>`;
}
$("#v-plan").addEventListener("click",e=>{ const b=e.target.closest("button[data-pd]"); if(!b) return; ui.day=+b.dataset.pd; ui.open=b.dataset.pid; location.hash="#today"; });

/* ---------- PROGRESS ---------- */
function renderProgress(){
  const v=$("#v-progress"); const ss=S.sessions;
  const d28=ss.filter(s=>s.start>Date.now()-28*864e5).length;
  const totalSets=ss.reduce((a,s)=>a+Object.values(s.ex).reduce((b,e)=>b+e.sets.length,0),0);
  let h=`<div class="vh"><div class="eyebrow">Tiến độ</div><h2>Bạn đã mạnh lên bao nhiêu</h2><p>1RM ước tính (công thức Epley) từ hiệp tốt nhất mỗi buổi. Với hít xà, app cộng thêm cân nặng cơ thể (${fw(S.prefs.bw)} kg).</p></div>
    <div class="stats"><div><b>${ss.length}</b><small>buổi đã lưu</small></div><div><b>${d28}</b><small>buổi trong 4 tuần</small></div><div><b>${totalSets}</b><small>hiệp đã làm</small></div></div>`;
  if(!ss.length){ v.innerHTML=h+`<div class="empty">Chưa có buổi tập nào được lưu.<br>Ở tab <b>Hôm nay</b>, đánh dấu ✓ từng hiệp rồi bấm <b>Kết thúc buổi tập</b>. Tiến độ từng bài sẽ hiện ở đây.</div>`; return; }
  const ids=Object.keys(EX).filter(id=>history(id).length);
  h+=`<div class="card"><h3>Theo bài tập</h3>${ids.map(id=>{ const hs=history(id); const best=hs.map(x=>Math.max(...x.sets.map(y=>e1(id,y.w,y.r))));
    const f=best[0], l=best[best.length-1]; const pct=f?((l-f)/f*100):0; const lastS=hs[hs.length-1];
    return `<details class="pex"><summary><span><b>${esc(EX[id].name)}</b><small>Gần nhất ${fmtDate(lastS.s.start)}: ${setsTxt(lastS.sets)}</small></span><span class="trend ${pct>0.5?"up":pct<-0.5?"dn":""}">${nf.format(Math.round(l))} kg<br>${hs.length>1?(pct>=0?"+":"")+nf.format(Math.round(pct*10)/10)+"%":"lần đầu"}</span></summary>
      <div class="hist">${hs.slice().reverse().map((x,k)=>`<div><span>${fmtDate(x.s.start)} · ${esc(x.s.ty)}</span><span>${setsTxt(x.sets)} · 1RM ${nf.format(Math.round(best[best.length-1-k]))}</span></div>`).join("")}</div></details>`; }).join("")}</div>`;
  h+=`<div class="card"><h3>Các buổi đã tập</h3><div class="sesl">${ss.slice().reverse().map(s=>{ const n=Object.values(s.ex).reduce((a,e)=>a+e.sets.length,0); const vol=Object.values(s.ex).reduce((a,e)=>a+e.sets.reduce((b,x)=>b+x.w*x.r,0),0);
    return `<div class="sesi"><span><b>${esc(s.ty)}</b> <small>${fmtDate(s.start)} · ${fmtClock(s.end-s.start)} · ${n} hiệp · ${nf.format(Math.round(vol))} kg</small></span><button class="x" data-del="${s.id}">${ui.confirm===s.id?"Bấm lần nữa để xoá":"Xoá"}</button></div>`; }).join("")}</div></div>`;
  v.innerHTML=h;
}
$("#v-progress").addEventListener("click",e=>{ const b=e.target.closest("button[data-del]"); if(!b) return; const id=+b.dataset.del;
  if(ui.confirm===id){ S.sessions=S.sessions.filter(s=>s.id!==id); ui.confirm=null; save(); toast("Đã xoá buổi tập"); } else ui.confirm=id; renderProgress(); });

/* ---------- DATA ---------- */
function renderData(){
  $("#v-data").innerHTML=`<div class="vh"><div class="eyebrow">Dữ liệu</div><h2>Lưu trữ & sao lưu</h2><p>Dữ liệu chỉ nằm trong trình duyệt này. Thỉnh thoảng hãy sao chép bản sao lưu và dán vào Ghi chú để không mất khi xoá dữ liệu trình duyệt hoặc đổi máy.</p></div>
  <div class="card"><h3>Cá nhân</h3><div class="frow"><label class="field" for="pBw">Cân nặng (kg)<input id="pBw" inputmode="decimal" value="${S.prefs.bw}"></label><label class="field" for="pSound">Âm báo hết giờ nghỉ<select id="pSound"><option value="1" ${S.prefs.sound?"selected":""}>Bật</option><option value="0" ${S.prefs.sound?"":"selected"}>Tắt</option></select></label></div>
    <p class="warm">Bộ nhớ trình duyệt: ${storeOK?"đang hoạt động":"<b style='color:var(--err)'>bị chặn, dữ liệu sẽ mất khi đóng trang</b>"} · ${S.sessions.length} buổi đã lưu.</p></div>
  <div class="card"><h3>Sao lưu</h3><textarea id="exp" readonly aria-label="Dữ liệu sao lưu">${esc(JSON.stringify(S))}</textarea><div class="confirm"><button class="btn ghost" id="bCopy">Sao chép</button></div></div>
  <div class="card"><h3>Khôi phục</h3><p>Dán bản sao lưu vào đây. Dữ liệu hiện tại sẽ bị thay thế.</p><textarea id="imp" aria-label="Dán dữ liệu khôi phục" placeholder='{"v":1,"sessions":[...]}'></textarea><div class="confirm" id="impC"><button class="btn ghost" id="bImp">Khôi phục</button></div></div>
  <div class="card"><h3>Xoá toàn bộ</h3><p>Xoá mọi buổi tập và buổi đang dở trên trình duyệt này.</p><div class="confirm" id="rstC"><button class="btn danger" id="bRst">Xoá toàn bộ dữ liệu</button></div></div>`;
  $("#pBw").onchange=e=>{ const v=parseFloat(e.target.value.replace(",",".")); if(v>25&&v<250){ S.prefs.bw=v; save(); toast("Đã lưu cân nặng"); } };
  $("#pSound").onchange=e=>{ S.prefs.sound=e.target.value==="1"; save(); unlockAudio(); if(S.prefs.sound) beep(1); };
  $("#bCopy").onclick=()=>{ const t=$("#exp"); const ok=()=>toast("Đã sao chép bản sao lưu"); try{ navigator.clipboard.writeText(t.value).then(ok,()=>{ t.select(); toast("Đã chọn sẵn, nhấn giữ để sao chép"); }); }catch(e){ t.select(); toast("Đã chọn sẵn, nhấn giữ để sao chép"); } };
  $("#bImp").onclick=()=>{ let o; try{ o=JSON.parse($("#imp").value); }catch(e){ toast("Dữ liệu không đúng định dạng JSON"); return; }
    if(!o||o.v!==1||!Array.isArray(o.sessions)){ toast("Đây không phải bản sao lưu PPL Coach"); return; }
    $("#impC").innerHTML=`<span>Thay ${S.sessions.length} buổi hiện có bằng ${o.sessions.length} buổi từ bản sao lưu?</span><button class="btn" id="iY">Thay thế</button><button class="btn ghost" id="iN">Huỷ</button>`;
    $("#iY").onclick=()=>{ S=Object.assign(fresh(),o); S.prefs=Object.assign({sound:true,bw:60},o.prefs||{}); save(); toast("Đã khôi phục"); renderData(); tickClock(); };
    $("#iN").onclick=renderData; };
  $("#bRst").onclick=()=>{ $("#rstC").innerHTML=`<span>Xoá vĩnh viễn ${S.sessions.length} buổi tập?</span><button class="btn danger" id="rY">Xoá</button><button class="btn ghost" id="rN">Huỷ</button>`;
    $("#rY").onclick=()=>{ S=fresh(); save(); for(const k in draft) delete draft[k]; stopRest(); toast("Đã xoá toàn bộ dữ liệu"); renderData(); tickClock(); };
    $("#rN").onclick=renderData; };
}

/* ---------- routing ---------- */
const VIEWS=["today","plan","progress","data"];
function route(){
  const h=(location.hash||"#today").slice(1); const v=VIEWS.includes(h)?h:"today"; ui.view=v;
  VIEWS.forEach(x=>{ $("#v-"+x).hidden=x!==v; });
  document.querySelectorAll(".tabbar a").forEach(a=>a.classList.toggle("on",a.dataset.v===v));
  if(v==="today") renderToday(); else if(v==="plan") renderPlan(); else if(v==="progress"){ ui.confirm=null; renderProgress(); } else renderData();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);

/* ---------- boot ---------- */
try{ if(window.THREE) demo=init3D({change:syncDemoUI,phase:onPhase}); }catch(err){ demo=null; console.error(err); }
route(); tickClock(); tickRest();
if(S.cur) lockScreen();
window.__ppl={EX,PROG,demo,get S(){return S;},ui,renderToday};

})();
</script>
<script>
if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost")){
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
